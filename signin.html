<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | NovaTech</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 text-slate-800">

  <!-- Header -->
  <header class="bg-white shadow-sm">
    <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 p-5">

      <a href="index.html" class="text-2xl font-bold text-indigo-600">
        NovaTech
      </a>

      <div class="flex flex-wrap gap-4 text-sm font-medium">
        <a href="index.html" class="hover:text-indigo-600">Home</a>

        <a href="about.html" class="hover:text-indigo-600">About</a>

        <a href="contact.html" class="hover:text-indigo-600">Contact</a>

        <a href="signin.html" class="text-indigo-600">Sign In</a>

        <a href="signup.html"
           class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">
          Sign Up
        </a>
      </div>

    </nav>
  </header>


  <!-- Main -->
  <main class="flex min-h-[650px] items-center justify-center px-5 py-14">

    <section class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-7 shadow-lg sm:p-9">

      <!-- Heading -->
      <div class="text-center">

        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-100 text-2xl text-indigo-600">
          N
        </div>

        <span class="mt-5 inline-block rounded-full bg-indigo-50 px-3 py-1 text-sm text-indigo-700">
          Welcome Back
        </span>

        <h1 class="mt-4 text-3xl font-extrabold">
          Sign In
        </h1>

        <p class="mt-2 text-slate-600">
          Enter your details to continue.
        </p>

      </div>


      <!-- Login Form -->
      <form id="loginForm" class="mt-8 space-y-5">

        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block text-sm font-medium">
            Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          >
        </div>


        <!-- Password -->
        <div>
          <label for="password" class="mb-2 block text-sm font-medium">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none transition focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          >
        </div>


        <!-- Login Button -->
        <button
          type="submit"
          class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-700"
        >
          Sign In
        </button>


        <!-- Message -->
        <p id="message" class="text-center text-sm font-medium"></p>

      </form>


      <!-- OR -->
      <div class="my-6 flex items-center gap-3">

        <div class="h-px flex-1 bg-slate-200"></div>

        <span class="text-sm text-slate-400">
          OR
        </span>

        <div class="h-px flex-1 bg-slate-200"></div>

      </div>


      <!-- Sign Up -->
      <a
        href="signup.html"
        class="block rounded-lg border border-slate-300 px-4 py-3 text-center font-medium hover:bg-slate-50"
      >
        Create a New Account
      </a>


      <!-- Demo Message -->
      <div class="mt-5 rounded-lg bg-indigo-50 p-4 text-center text-sm text-indigo-800">
        Demo Login: admin@gmail.com / 12345
      </div>

    </section>

  </main>


  <!-- Footer -->
  <footer class="bg-slate-900 p-8 text-center text-white">

    <p class="text-xl font-bold">
      NovaTech
    </p>

    <p class="mt-2 text-sm text-slate-300">
      Innovative solutions for a digital world.
    </p>

    <div class="mt-4 flex flex-wrap justify-center gap-5 text-sm">

      <a href="index.html" class="hover:text-indigo-300">
        Home
      </a>

      <a href="about.html" class="hover:text-indigo-300">
        About
      </a>

      <a href="contact.html" class="hover:text-indigo-300">
        Contact
      </a>

      <a href="signup.html" class="hover:text-indigo-300">
        Sign Up
      </a>

    </div>

    <p class="mt-5 text-sm text-slate-400">
      © 2026 NovaTech. All rights reserved.
    </p>

  </footer>


  <!-- Login JavaScript -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (email === "admin@gmail.com" && password === "12345") {

        message.textContent = "Login Successful!";
        message.className = "text-center text-sm font-medium text-green-600";

        setTimeout(function() {
          window.location.href = "index.html";
        }, 1000);

      } else {

        message.textContent = "Invalid email or password!";
        message.className = "text-center text-sm font-medium text-red-600";

      }

    });
  </script>

</body>
</html>
