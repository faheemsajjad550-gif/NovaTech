<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | NovaTech</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 text-slate-800">

  <!-- Header -->
  <header class="bg-white shadow-sm">
    <nav class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 p-5">

      <a href="index.html" class="text-2xl font-bold text-indigo-600">
        NovaTech
      </a>

      <div class="flex flex-wrap gap-4 text-sm font-medium">
        <a href="index.html" class="hover:text-indigo-600">Home</a>
        <a href="about.html" class="hover:text-indigo-600">About</a>
        <a href="contact.html" class="hover:text-indigo-600">Contact</a>
        <a href="signin.html" class="hover:text-indigo-600">Sign In</a>

        <a href="signup.html"
           class="rounded-lg bg-indigo-600 px-4 py-2 text-white">
          Sign Up
        </a>
      </div>

    </nav>
  </header>


  <!-- Main -->
  <main class="flex items-center justify-center px-5 py-14">

    <section class="w-full max-w-lg rounded-2xl border border-slate-200 bg-white p-7 shadow-lg sm:p-9">

      <!-- Heading -->
      <div class="text-center">

        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-indigo-100 text-2xl font-bold text-indigo-600">
          N
        </div>

        <span class="mt-5 inline-block rounded-full bg-indigo-50 px-3 py-1 text-sm text-indigo-700">
          Join Our Community
        </span>

        <h1 class="mt-4 text-3xl font-extrabold">
          Create Your Account
        </h1>

        <p class="mt-2 text-slate-600">
          Fill in the details below to get started.
        </p>

      </div>


      <!-- Signup Form -->
      <form id="signupForm" class="mt-8 space-y-5">

        <!-- Full Name -->
        <div>
          <label for="name" class="mb-2 block font-medium">
            Full Name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            required
            autocomplete="name"
            placeholder="Your full name"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          >
        </div>


        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block font-medium">
            Email Address
          </label>

          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          >
        </div>


        <!-- Password -->
        <div>
          <label for="password" class="mb-2 block font-medium">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          >
        </div>


        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="mb-2 block font-medium">
            Confirm Password
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Enter password again"
            class="w-full rounded-lg border border-slate-300 px-4 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"
          >
        </div>


        <!-- Terms -->
        <label class="flex items-start gap-3 text-sm text-slate-600">

          <input
            id="terms"
            type="checkbox"
            required
            class="mt-1 accent-indigo-600"
          >

          <span>
            I agree to the terms and conditions.
          </span>

        </label>


        <!-- Button -->
        <button
          type="submit"
          class="w-full rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700"
        >
          Create Account
        </button>


        <!-- Message -->
        <p
          id="signupMessage"
          class="text-center text-sm font-medium"
          aria-live="polite"
        ></p>

      </form>


      <!-- Sign In -->
      <p class="mt-6 text-center text-sm text-slate-600">

        Already have an account?

        <a
          href="signin.html"
          class="font-semibold text-indigo-600 hover:underline"
        >
          Sign In
        </a>

      </p>

    </section>

  </main>


  <!-- Footer -->
  <footer class="bg-slate-900 p-8 text-center text-white">

    <p class="text-xl font-bold">
      NovaTech
    </p>

    <p class="mt-2 text-sm text-slate-300">
      Innovative solutions for a digital world.
    </p>

    <div class="mt-4 flex flex-wrap justify-center gap-5 text-sm">

      <a href="index.html" class="hover:text-indigo-300">
        Home
      </a>

      <a href="about.html" class="hover:text-indigo-300">
        About
      </a>

      <a href="contact.html" class="hover:text-indigo-300">
        Contact
      </a>

      <a href="signin.html" class="hover:text-indigo-300">
        Sign In
      </a>

    </div>

    <p class="mt-5 text-sm text-slate-400">
      © 2026 NovaTech. All rights reserved.
    </p>

  </footer>


  <!-- Signup JavaScript -->
  <script>

    document.getElementById("signupForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("signupMessage");

      // Check passwords
      if (password !== confirmPassword) {

        message.textContent = "Passwords do not match.";
        message.className = "text-center text-sm font-medium text-red-600";

        return;
      }


      // Check password length
      if (password.length < 8) {

        message.textContent = "Password must be at least 8 characters.";
        message.className = "text-center text-sm font-medium text-red-600";

        return;
      }


      // Get existing users
      let users = JSON.parse(localStorage.getItem("novaTechUsers")) || [];


      // Check if email already exists
      const existingUser = users.find(function(user) {
        return user.email === email;
      });


      if (existingUser) {

        message.textContent = "An account with this email already exists.";
        message.className = "text-center text-sm font-medium text-red-600";

        return;
      }


      // Create new user
      const newUser = {
        name: name,
        email: email,
        password: password
      };


      // Save user
      users.push(newUser);

      localStorage.setItem("novaTechUsers", JSON.stringify(users));


      // Success message
      message.textContent = "Account created successfully! Redirecting...";
      message.className = "text-center text-sm font-medium text-green-600";


      // Redirect to sign in
      setTimeout(function() {

        window.location.href = "signin.html";

      }, 1500);

    });

  </script>

</body>
</html>
